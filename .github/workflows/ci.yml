name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify HTML File
        run: |
          test -f index.html
          echo "index.html exists"

      - name: Verify CSS File
        run: |
          test -f style.css
          echo "style.css exists"

      - name: Build
        run: |
          echo "Building DevOps WebApp..."
          echo "Build completed successfully!"

      - name: Test
        run: |
          echo "Running tests..."
          echo "All tests passed!"

      - name: Generate Logs
        run: |
          echo "CI Pipeline completed successfully"
          date